name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typkontroll och tester
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  postgres:
    name: Tester mot Postgres 16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synkenpluz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_URL: postgres://postgres:postgres@localhost:5432/synkenpluz_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --passWithNoTests: jobbet ska vara grönt även om test/pg ännu inte finns.
      - run: npx vitest run test/pg --passWithNoTests

  # Bygger produktionsavbilden och kontrollerar att den startar och ger ett tydligt konfigurationsfel
  # utan hemligheter (alltså att alla importer löser sig med bara produktionsberoenden).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t synkenpluz:ci .
      - name: Starta utan konfiguration (förväntat fel, inte kraschade importer)
        run: |
          set +e
          out="$(docker run --rm synkenpluz:ci 2>&1)"
          echo "$out"
          echo "$out" | grep -q "Ogiltig konfiguration"
